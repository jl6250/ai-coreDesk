# =========================================================
# Nginx 反向代理配置模板 (适用于智服云 CoreDesk)
# 可放置于 /etc/nginx/conf.d/coredesk.conf 或 sites-available
# =========================================================

upstream coredesk_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name your_domain_or_server_ip; # 请替换为你的域名或服务器公网 IP

    # 推荐重定向到 HTTPS (若已配置 SSL 证书)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # 启用 Gzip 压缩提升加载速度
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://coredesk_backend;
        proxy_http_version 1.1;

        # 支持 WebSocket 与长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端真实 IP 和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 静态资源缓存优化 (可选直接由 Nginx 分发或穿透)
    location /static/ {
        proxy_pass http://coredesk_backend/static/;
        proxy_cache_valid 200 304 12h;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
